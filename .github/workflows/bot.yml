name: Miniblox Multi-Bot

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: server1
            cardData: "DONT JOIN! I AM AFK!"
          - server: server2
            cardData: "DONT JOIN! I AM AFK! #2"
          - server: server3
            cardData: "DONT JOIN! I AM AFK! #3"
          - server: server4
            cardData: "DONT JOIN! I AM AFK! #4"
          - server: server5
            cardData: "DONT JOIN! I AM AFK! #5"
          # - server: server6
          #   cardData: "DONT JOIN! I AM AFK! #6"
          # - server: server7
          #   cardData: "DONT JOIN! I AM AFK! #7"
          # - server: server8
          #   cardData: "DONT JOIN! I AM AFK! #8"
          # - server: server9
          #   cardData: "DONT JOIN! I AM AFK! #9"
          # - server: server10
          #   cardData: "DONT JOIN! I AM AFK! #10"
          # - server: server11
          #   cardData: "DONT JOIN! I AM AFK! #11"
          # - server: server12
          #   cardData: "DONT JOIN! I AM AFK! #12"
          # - server: server13
          #   cardData: "DONT JOIN! I AM AFK! #13"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Run bot (${{ matrix.server }})
        env:
          SERVER_NAME: ${{ matrix.server }}
          CARD_DATA: ${{ matrix.cardData }}
          MB_SESSION: ${{ secrets.MB_SESSION }}
        run: npm start
