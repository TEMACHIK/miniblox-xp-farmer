name: Miniblox Browse All (parallel)

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  browse:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx playwright install chromium --with-deps
      - name: Run parallel browse
        env:
          BROWSE_MODE: '1'
          SERVER_NAME: 'browse'
          MB_SESSION: ${{ secrets.MB_SESSION }}
          MAX_SERVERS: '4'
          LAUNCH_STAGGER_SEC: '45'
        run: npm start
