name: Miniblox Multi-Bot

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: skdke
            worldId: 3080530
          - server: lovely-smp
            worldId: 3037844
          - server: hide-and-seek
            worldId: 3081484
          - server: gun-game
            worldId: 3036573
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Run bot (${{ matrix.server }})
        env:
          WORLD_ID: ${{ matrix.worldId }}
          SERVER_NAME: ${{ matrix.server }}
          MB_SESSION: ${{ secrets.MB_SESSION }}
        run: npm start
